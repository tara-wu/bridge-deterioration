name: ci

# Runs the parsing tests and a full DuckDB + dbt build on synthetic fixture
# files on every push. The scheduled refresh with real data comes in month 3.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
